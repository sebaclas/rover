<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rover Control Panel</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            width: 90%;
            max-width: 1200px;
            padding-bottom: 2rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card h2 {
            margin: 0 0 1rem 0;
            font-size: 0.9rem;
            opacity: 0.7;
            text-transform: uppercase;
        }

        /* Gauge de Distancia */
        .gauge-container {
            position: relative;
            width: 200px;
            height: 100px;
            overflow: hidden;
        }

        .gauge-bg {
            width: 200px;
            height: 100px;
            border-top-left-radius: 100px;
            border-top-right-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .gauge-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 100px;
            border-top-left-radius: 100px;
            border-top-right-radius: 100px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            transform-origin: bottom center;
            transform: rotate(0deg);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gauge-value {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
        }

        /* Controles */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.9);
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
        }

        .btn.stop { background: rgba(239, 68, 68, 0.2); }
        .btn.stop:active { background: #ef4444; }

        .btn-update {
            margin-top: auto;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .btn-update:hover {
            background: var(--primary);
            color: var(--bg);
        }

        .status {
            font-size: 0.8rem;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .dot.online {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .servo-input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .input-dark {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 1rem;
        }

        .btn-small {
            padding: 8px 15px;
            border-radius: 10px;
            border: none;
            background: var(--secondary);
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* MPU-6050 Card Styles */
        .tilt-container {
            width: 100%;
            max-width: 220px;
            height: 120px;
            perspective: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 15px;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .tilt-card {
            width: 80px;
            height: 140px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(79, 172, 254, 0.25));
            border: 2px solid var(--primary);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.2);
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            transition: transform 0.15s ease-out;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            position: relative;
        }
        
        /* Ejes X/Y sobre la placa */
        .axis {
            position: absolute;
            background: currentColor;
            transform-origin: center;
            display: flex;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        
        .axis-x {
            color: #10b981; /* Verde para X (Adelante) */
            width: 2px;
            height: 50px;
            left: 50%;
            bottom: 50%;
            transform: translateX(-50%);
            flex-direction: column;
            justify-content: flex-start;
        }
        .axis-x .axis-arrow {
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 6px solid currentColor;
            margin-bottom: 2px;
        }
        
        .axis-y {
            color: #ef4444; /* Rojo para Y (Derecha) */
            width: 50px;
            height: 2px;
            left: 50%;
            top: 50%;
            transform: translateY(-50%);
            justify-content: flex-end;
        }
        .axis-y .axis-arrow {
            width: 0;
            height: 0;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            border-left: 6px solid currentColor;
            margin-left: 2px;
        }
        
        .axis-label {
            font-size: 0.6rem;
            font-weight: 900;
            position: absolute;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .axis-x .axis-label {
            top: -12px;
        }
        .axis-y .axis-label {
            right: -10px;
        }
        
        .tilt-card-chip {
            width: 20px;
            height: 20px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 4px;
            margin-top: -30px; /* Mover arriba para dejar libre el origen */
            margin-bottom: 12px;
            position: relative;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        
        .tilt-card-chip::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 4px;
            height: 4px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 5px #ef4444;
        }

    </style>
</head>
<body>
    <div class="header">
        <h1 id="main-title">Rover Explorer</h1>
    </div>

    <div class="dashboard">
        <!-- Telemetría Sonar -->
        <div class="card">
            <h2>Orientación Sonar</h2>
            <div class="gauge-container">
                <div class="gauge-bg"></div>
                <div id="gauge-fill" class="gauge-fill"></div>
                <div id="distancia" class="gauge-value">--</div>
            </div>
            <p style="font-size: 0.8rem; opacity: 0.6; margin-bottom: 5px;">Distancia (cm)</p>
            
            <div class="servo-input-group">
                <input type="number" id="servo-angle" class="input-dark" value="0" min="-70" max="70">
                <button class="btn-small" onclick="sendServo()">Girar</button>
            </div>
            <p style="font-size: 0.7rem; opacity: 0.4; margin-top: 5px;">-70° a +70°</p>
        </div>

        <!-- Control de Movimiento -->
        <div class="card">
            <h2>Navegación Manual</h2>
            <div class="controls">
                <div></div>
                <button class="btn" onmousedown="sendCommand('UP')" onmouseup="sendCommand('STOP')">▲</button>
                <div></div>
                <button class="btn" onmousedown="sendCommand('LEFT')" onmouseup="sendCommand('STOP')">◀</button>
                <button class="btn stop" onclick="sendCommand('STOP')">■</button>
                <button class="btn" onmousedown="sendCommand('RIGHT')" onmouseup="sendCommand('STOP')">▶</button>
                <div></div>
                <button class="btn" onmousedown="sendCommand('DOWN')" onmouseup="sendCommand('STOP')">▼</button>
                <div></div>
            </div>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button class="btn-small" onclick="sendCommand('TURN_LEFT_90')">↶ Giro 90°</button>
                <button class="btn-small" onclick="sendCommand('TURN_RIGHT_90')">Giro 90° ↷</button>
            </div>
            <div class="status">
                <div id="status-dot" class="dot"></div>
                <span id="status-text">Desconectado</span>
            </div>
        </div>

        <!-- Telemetría IMU (MPU-6050) -->
        <div class="card">
            <h2>Telemetría IMU (MPU-6050)</h2>
            <div class="tilt-container">
                <div id="tilt-card" class="tilt-card">
                    <div class="tilt-card-chip"></div>
                    <span style="z-index: 10; font-size: 0.65rem; opacity: 0.8; text-align: center; margin-top: 5px;">ROVER<br>IMU</span>
                    <!-- Eje X (Verde, Adelante/Arriba) -->
                    <div class="axis axis-x">
                        <div class="axis-arrow"></div>
                        <span class="axis-label">+X</span>
                    </div>
                    <!-- Eje Y (Rojo, Derecha) -->
                    <div class="axis axis-y">
                        <div class="axis-arrow"></div>
                        <span class="axis-label">+Y</span>
                    </div>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; text-align: center; font-size: 0.8rem;">
                <div>
                    <span style="display: block; opacity: 0.5; font-size: 0.65rem; text-transform: uppercase; margin-bottom: 4px;">Accel (g)</span>
                    <strong id="imu-accel" style="font-size: 0.8rem; line-height: 1.2;">X: 0.00<br>Y: 0.00<br>Z: 1.00</strong>
                </div>
                <div>
                    <span style="display: block; opacity: 0.5; font-size: 0.65rem; text-transform: uppercase; margin-bottom: 4px;">Gyro (°/s)</span>
                    <strong id="imu-gyro" style="font-size: 0.8rem; line-height: 1.2;">X: 0.0<br>Y: 0.0<br>Z: 0.0</strong>
                </div>
                <div>
                    <span style="display: block; opacity: 0.5; font-size: 0.65rem; text-transform: uppercase; margin-bottom: 4px;">Temp IMU</span>
                    <strong id="imu-temp" style="font-size: 1rem; color: #f43f5e; display: block; margin-top: 5px;">-- °C</strong>
                </div>
            </div>
        </div>

        <!-- Sistema / OTA -->
        <div class="card">
            <h2>Estado del Sistema</h2>
            <p id="version-label" style="font-size: 1.2rem; font-weight: bold;">v0.1.0</p>
            <button class="btn-update" onclick="checkUpdate()">Buscar Actualización</button>
        </div>
    </div>

    <script>
        let ws;
        const distLabel = document.getElementById('distancia');
        const gaugeFill = document.getElementById('gauge-fill');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        function connect() {
            ws = new WebSocket('ws://' + window.location.host + '/ws');
            
            ws.onopen = () => {
                statusDot.classList.add('online');
                statusText.innerText = 'Online';
            };

            ws.onclose = () => {
                statusDot.classList.remove('online');
                statusText.innerText = 'Offline - Reconectando...';
                setTimeout(connect, 2000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // Distancia Sonar
                if(data.distancia !== undefined) {
                    const dist = data.distancia;
                    distLabel.innerText = dist === -1 ? 'OFF' : dist;
                    
                    // Cálculo de ángulo para el gauge (0 a 180 deg)
                    // Asumimos 200cm como maximo util
                    const ratio = Math.min(dist / 200, 1);
                    const angle = ratio * 180;
                    gaugeFill.style.transform = `rotate(${angle}deg)`;
                }

                // Telemetría MPU-6050
                if(data.mpu !== undefined) {
                    const mpu = data.mpu;
                    
                    // Actualizar etiquetas numéricas
                    document.getElementById('imu-accel').innerHTML = 
                        `X: ${mpu.accel.x.toFixed(2)}<br>` +
                        `Y: ${mpu.accel.y.toFixed(2)}<br>` +
                        `Z: ${mpu.accel.z.toFixed(2)}`;
                        
                    document.getElementById('imu-gyro').innerHTML = 
                        `X: ${mpu.gyro.x.toFixed(1)}<br>` +
                        `Y: ${mpu.gyro.y.toFixed(1)}<br>` +
                        `Z: ${mpu.gyro.z.toFixed(1)}`;
                        
                    document.getElementById('imu-temp').innerText = `${mpu.temp.toFixed(1)} °C`;
                    
                    // Calcular inclinación (Pitch & Roll) basados en fuerzas de gravedad
                    const ax = mpu.accel.x;
                    const ay = mpu.accel.y;
                    const az = mpu.accel.z;
                    
                    // Fórmulas estándar de Pitch y Roll en grados
                    let roll = Math.atan2(ay, az) * (180 / Math.PI);
                    let pitch = Math.atan2(-ax, Math.sqrt(ay * ay + az * az)) * (180 / Math.PI);
                    
                    // Limitar ángulos para evitar giros drásticos 3D
                    roll = Math.max(-45, Math.min(45, roll));
                    pitch = Math.max(-45, Math.min(45, pitch));
                    
                    // Aplicar rotación 3D a la placa visual en la interfaz
                    const tiltCard = document.getElementById('tilt-card');
                    if(tiltCard) {
                        tiltCard.style.transform = `rotateX(${pitch}deg) rotateY(${roll}deg)`;
                    }
                }
            };
        }

        function sendCommand(cmd) {
            if(ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({command: cmd}));
            }
        }

        function sendServo() {
            const input = document.getElementById('servo-angle');
            let angle = parseInt(input.value);
            if (isNaN(angle)) angle = 0;
            angle = Math.max(-70, Math.min(70, angle));
            input.value = angle;
            if(ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({servo: angle}));
            }
        }

        let activeKey = null;

        document.addEventListener('keydown', (event) => {
            if (event.repeat) return;
            if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

            let cmd = null;
            if (event.code === 'ArrowUp' || event.code === 'KeyW') {
                cmd = 'UP';
            } else if (event.code === 'ArrowDown' || event.code === 'KeyS') {
                cmd = 'DOWN';
            } else if (event.code === 'ArrowLeft' || event.code === 'KeyA') {
                cmd = 'LEFT';
            } else if (event.code === 'ArrowRight' || event.code === 'KeyD') {
                cmd = 'RIGHT';
            }

            if (cmd) {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) {
                    event.preventDefault();
                }
                activeKey = event.code;
                sendCommand(cmd);
            }
        });

        document.addEventListener('keyup', (event) => {
            const movementKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyS', 'KeyA', 'KeyD'];
            if (movementKeys.includes(event.code)) {
                activeKey = null;
                sendCommand('STOP');
            }
        });

        function checkUpdate() {
            if(confirm('¿Deseas buscar y aplicar actualizaciones vía OTA? El Rover se reiniciará.')) {
                fetch('/update').then(r => alert('Procesando actualización...'));
            }
        }

        function fetchVersion() {
            fetch('/version')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('version-label').innerText = 'v' + data.version;
                    document.getElementById('main-title').innerText = 'Rover Explorer v' + data.version;
                })
                .catch(e => console.log('Error fetching version', e));
        }

        connect();
        fetchVersion();
    </script>
</body>
</html>
